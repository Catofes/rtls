name: CI

on:
  push:
    branches:
      - master
      - release/*
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:

  test:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test -race ./...

      - name: Vet production packages
        run: go vet ./src

      - name: Build
        run: go build ./...

